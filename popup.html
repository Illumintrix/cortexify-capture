<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Cortexify Capture</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><img src="icons/cortexify-logo.svg" alt=""><span>Cortexify</span></div>
    <div class="header-actions"><button id="theme" class="icon-button theme-button" title="Theme: system" aria-label="Theme: system"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8 8 0 0 1 8.8 4 8 8 0 1 0 20 15.2Z"/></svg></button><button id="open" class="icon-button" title="Open Cortexify library" aria-label="Open Cortexify library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></svg>
    </button></div>
  </header>

  <section id="connect" hidden>
    <div class="connect-card">
      <div class="logo-well"><img src="icons/cortexify-logo.svg" alt="Cortexify"></div>
      <p class="eyebrow">CORTEXIFY CAPTURE</p>
      <h1>Keep the thought.<br><span>Lose the tab.</span></h1>
      <p class="lede">Connect once, then send anything to your library without breaking focus.</p>
      <button id="connectBtn" class="primary"><span>Connect Cortexify</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </section>

  <section id="capture" hidden>
    <div class="section-heading"><span>READY TO CAPTURE</span><span id="dup" class="saved-badge" hidden><i></i>Saved</span></div>
    <div class="page-card">
      <div class="favicon-wrap"><img id="favicon" alt=""></div>
      <div class="page-copy"><b id="title"></b><small id="host"></small></div>
      <svg class="page-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h14M7 17V7a2 2 0 0 1 2-2h6l2 2v10M9 10h6M9 13h6"/></svg>
    </div>

    <label class="field-label" for="collection">COLLECTION</label>
    <div class="select-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>
      <select id="collection"><option value="">Inbox · decide later</option></select>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
    </div>

    <button id="save" class="primary save-button">
      <span class="button-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save to Cortexify</span>
      <kbd>⌥ ⇧ S</kbd>
    </button>

    <div class="action-grid">
      <button id="selection" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 12h8"/></svg><span>Selection<small>Save highlighted text</small></span></button>
      <button id="tabs" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4"/></svg><span>Tab stack<small>Choose from this window</small></span></button>
    </div>

    <div id="batch" class="batch-panel" hidden>
      <div class="batchhead"><b>Choose tabs</b><small id="tabCount"></small></div>
      <div id="tabList" class="batch-list"></div>
      <button id="saveTabs" class="primary">Save selected tabs</button>
    </div>
  </section>

  <footer><span id="status"><i></i>Ready</span><button id="disconnect">Disconnect</button></footer>
</main>
<script src="api.js"></script><script src="popup.js"></script>
</body>
</html>
